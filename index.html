<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jazz Chord App</title>
<style>
  :root { font-family: system-ui, sans-serif; color:#111827; background:#f8fafc; }
  body { margin:0; padding:24px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:#6b7280; margin:0 0 20px; font-size:.9rem; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px 20px; margin-bottom:16px; max-width:860px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  button { border:1px solid #d1d5db; background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:.95rem; }
  button:hover { background:#eef2ff; border-color:#6366f1; }
  button.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
  input#chordInput { font-size:1.1rem; padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; width:220px; }
  .label { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:#6b7280; margin-top:10px; }
  #noteNames { font-size:1.3rem; font-family: ui-monospace, monospace; margin-top:8px; }
  #chordSymbol { font-size:1.6rem; font-weight:700; margin-bottom:4px; }
  .err { color:#dc2626; }
  svg { max-width:100%; }
</style>
</head>
<body>
<h1>Jazz Chord App</h1>
<p class="sub">Akkord eingeben (Tastatur oder Buttons) → Notennamen + Notenbild. Englische Notation (C, D, E, F, G, A, B). Sprache &amp; Audio folgen später.</p>

<div class="card">
  <div class="label">Eingabe</div>
  <div class="row">
    <input id="chordInput" placeholder="z.B. Cmaj7, F#m7b5, Bb13" />
    <button id="parseBtn">Akkord anzeigen</button>
    <button id="playBtn">&#9654; Abspielen</button>
  </div>
  <div class="label">Grundton</div>
  <div class="row" id="roots"></div>
  <div class="label">Akkordtyp</div>
  <div class="row" id="qualities"></div>
</div>

<div class="card">
  <div id="chordSymbol">–</div>
  <div id="noteNames">–</div>
  <div id="staff"></div>
</div>

<script>
// ---------- Musiktheorie ----------
const LETTERS = ['C','D','E','F','G','A','B'];
const LETTER_PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};

// Intervalle: [Halbtöne ab Grundton, Grad (für die Schreibweise)]
const QUALITIES = {
  '':        {label:'Major (Dur)',            iv:[[0,1],[4,3],[7,5]]},
  'maj7':    {label:'maj7',                   iv:[[0,1],[4,3],[7,5],[11,7]]},
  '7':       {label:'7 (dominant)',           iv:[[0,1],[4,3],[7,5],[10,7]]},
  'm':       {label:'m (Moll)',               iv:[[0,1],[3,3],[7,5]]},
  'm7':      {label:'m7',                     iv:[[0,1],[3,3],[7,5],[10,7]]},
  'mMaj7':   {label:'m(maj7)',                iv:[[0,1],[3,3],[7,5],[11,7]]},
  '6':       {label:'6',                      iv:[[0,1],[4,3],[7,5],[9,6]]},
  'm6':      {label:'m6',                     iv:[[0,1],[3,3],[7,5],[9,6]]},
  '6/9':     {label:'6/9',                    iv:[[0,1],[4,3],[7,5],[9,6],[14,6]]},
  'm7b5':    {label:'m7b5 (halbdim.)',        iv:[[0,1],[3,3],[6,5],[10,7]]},
  'dim':     {label:'dim (vermindert)',       iv:[[0,1],[3,3],[6,5]]},
  'dim7':    {label:'dim7 (verm. 7)',         iv:[[0,1],[3,3],[6,5],[9,7]]},
  'aug':     {label:'aug (überm.)',           iv:[[0,1],[4,3],[8,5]]},
  '7b5':     {label:'7b5',                    iv:[[0,1],[4,3],[6,5],[10,7]]},
  '7#5':     {label:'7#5',                    iv:[[0,1],[4,3],[8,5],[10,7]]},
  '7b9':     {label:'7b9',                    iv:[[0,1],[4,3],[7,5],[10,7],[13,7]]},
  '7#9':     {label:'7#9',                    iv:[[0,1],[4,3],[7,5],[10,7],[15,7]]},
  '7alt':    {label:'7alt',                   iv:[[0,1],[4,3],[6,5],[8,5],[10,7],[13,7]]},
  '9':       {label:'9',                      iv:[[0,1],[4,3],[7,5],[10,7],[14,7]]},
  'maj9':    {label:'maj9',                   iv:[[0,1],[4,3],[7,5],[11,7],[14,7]]},
  'm9':      {label:'m9',                     iv:[[0,1],[3,3],[7,5],[10,7],[14,7]]},
  '11':      {label:'11',                     iv:[[0,1],[4,3],[7,5],[10,7],[14,7],[17,11]]},
  'maj13':   {label:'maj13',                  iv:[[0,1],[4,3],[7,5],[11,7],[14,7],[21,13]]},
  '13':      {label:'13',                     iv:[[0,1],[4,3],[7,5],[10,7],[14,7],[21,13]]},
  'm11':     {label:'m11',                    iv:[[0,1],[3,3],[7,5],[10,7],[14,7],[17,11]]},
  'm13':     {label:'m13',                    iv:[[0,1],[3,3],[7,5],[10,7],[14,7],[21,13]]},
  'sus4':    {label:'sus4',                   iv:[[0,1],[5,4],[7,5]]},
  'sus2':    {label:'sus2',                   iv:[[0,1],[2,2],[7,5]]},
  '7sus4':   {label:'7sus4',                  iv:[[0,1],[5,4],[7,5],[10,7]]},
  'add9':    {label:'add9',                   iv:[[0,1],[4,3],[7,5],[14,7]]}
};

// Suffix-Aliase für den Text-Parser
const ALIASES = {
  'maj7':'maj7','M7':'maj7','maj':'','M':'','Δ':'maj7','^':'maj7',
  '7':'7','dom7':'7',
  'm':'m','min':'m','-':'m','m7':'m7','min7':'m7','-7':'m7',
  'mMaj7':'mMaj7','m(maj7)':'mMaj7','minMaj7':'mMaj7',
  '6':'6','m6':'m6','-6':'m6','6/9':'6/9',
  'm7b5':'m7b5','ø':'m7b5','ø7':'m7b5','half-dim':'m7b5',
  'dim':'dim','o':'dim','°':'dim','dim7':'dim7','o7':'dim7','°7':'dim7',
  'aug':'aug','+':'aug','7b5':'7b5','7#5':'7#5','7alt':'7alt',
  '7b9':'7b9','7#9':'7#9','9':'9','maj9':'maj9','M9':'maj9','m9':'m9','-9':'m9',
  '11':'11','13':'13','maj13':'maj13','m11':'m11','m13':'m13',
  'sus4':'sus4','sus':'sus4','sus2':'sus2','7sus4':'7sus4','7sus':'7sus4','add9':'add9'
};

function parseRoot(s){
  const m = s.match(/^([A-G])([#b]*)/);
  if(!m) return null;
  let alter = 0;
  for(const c of m[2]) alter += (c==='#' ? 1 : -1);
  if(alter > 2 || alter < -2) return null;
  return {letter:m[1], alter};
}

function parseChord(str){
  const s = str.trim().replace(/\s+/g,'');
  const root = parseRoot(s);
  if(!root) return null;
  let suffix = s.replace(/^[A-G][#b]*/,'');
  if(suffix in ALIASES) suffix = ALIASES[suffix];
  if(!(suffix in QUALITIES)) return null;
  return {root, quality:suffix};
}

// Note buchstabengetreu buchstabieren
function spell(root, semis, degree){
  const rootLetterIdx = LETTERS.indexOf(root.letter);
  const letterIdx = (rootLetterIdx + degree - 1) % 7;
  const letter = LETTERS[letterIdx];
  const rootPc = ((LETTER_PC[root.letter] + root.alter) % 12 + 12) % 12;
  const targetPc = (rootPc + semis) % 12;
  let alter = targetPc - LETTER_PC[letter];
  if(alter > 6) alter -= 12;
  if(alter < -6) alter += 12;
  return {letter, alter};
}

function chordNotes(root, quality){
  return QUALITIES[quality].iv.map(([semis,deg]) => {
    const n = spell(root, semis, deg);
    // Oktave fürs Notenbild: um die Mitte (Oktave 4) herum
    const rootLetterIdx = LETTERS.indexOf(root.letter);
    const letterIdx = LETTERS.indexOf(n.letter);
    let oct = 4;
    const dist = ((letterIdx - rootLetterIdx) % 7 + 7) % 7;
    if(dist >= 4) oct = 5; // obere Töne eine Oktave höher setzen
    return {...n, octave: oct, semis};
  });
}

// ---------- Notenbild (SVG) ----------
const ACC = {1:'♯',0:'',[-1]:'♭',2:'♯♯',[-2]:'♭♭'};
// diatonische Stufe relativ zum mittleren B4 (Notenlinie 3, y=100)
const STAFF_STEP = {C:0,D:1,E:2,F:3,G:4,A:5,B:6}; // pro Oktave

function noteY(letter, octave){
  const step = (octave-4)*7 + STAFF_STEP[letter]; // B4 = 0
  return 100 - step*5; // 5px pro Stufe, B4 auf Mittellinie
}

function renderStaff(notes){
  const W = 520, H = 220;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  // 5 Linien: E5(80) bis F4(120), Linienabstand 10
  for(let i=0;i<5;i++){
    const y = 80 + i*10;
    svg += `<line x1="20" y1="${y}" x2="${W-20}" y2="${y}" stroke="#111827" stroke-width="1"/>`;
  }
  // Violinschlüssel als Text-Glyphen-Ersatz
  svg += `<text x="24" y="112" font-size="64" fill="#111827" font-family="serif">&#119070;</text>`;
  let x = 100;
  for(const n of notes){
    const y = noteY(n.letter, n.octave);
    // Hilfslinien
    if(y <= 70){ for(let ly=70; ly>=y; ly-=10) svg += `<line x1="${x-14}" y1="${ly}" x2="${x+14}" y2="${ly}" stroke="#111827"/>`; }
    if(y >= 130){ for(let ly=130; ly<=y; ly+=10) svg += `<line x1="${x-14}" y1="${ly}" x2="${x+14}" y2="${ly}" stroke="#111827"/>`; }
    svg += `<ellipse cx="${x}" cy="${y}" rx="9" ry="6.5" fill="none" stroke="#111827" stroke-width="2" transform="rotate(-20 ${x} ${y})"/>`;
    const acc = ACC[n.alter] ?? '';
    if(acc) svg += `<text x="${x-30}" y="${y+6}" font-size="22" fill="#111827">${acc}</text>`;
    x += 58;
  }
  svg += '</svg>';
  return svg;
}

// ---------- UI ----------
let selRoot = {letter:'C', alter:0};
let selQuality = 'maj7';

const rootsEl = document.getElementById('roots');
const qualEl = document.getElementById('qualities');
const input = document.getElementById('chordInput');
const symEl = document.getElementById('chordSymbol');
const namesEl = document.getElementById('noteNames');
const staffEl = document.getElementById('staff');

const ROOT_LABELS = ['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];
ROOT_LABELS.forEach(r=>{
  const b = document.createElement('button');
  b.textContent = r;
  b.dataset.root = r;
  b.onclick = ()=>{ setRoot(r); input.value = r + (ALIASES[selQuality] ?? selQuality); update(); };
  rootsEl.appendChild(b);
});

Object.entries(QUALITIES).forEach(([q,def])=>{
  const b = document.createElement('button');
  b.textContent = def.label;
  b.dataset.q = q;
  b.onclick = ()=>{ selQuality = q; input.value = rootLabel(selRoot) + q; update(); refreshButtons(); };
  qualEl.appendChild(b);
});

function rootLabel(r){ return r.letter + (r.alter>0 ? '#'.repeat(r.alter) : r.alter<0 ? 'b'.repeat(-r.alter) : ''); }

function setRoot(label){
  const r = parseRoot(label);
  if(r) selRoot = r;
  refreshButtons();
}
function refreshButtons(){
  document.querySelectorAll('#roots button').forEach(b=> b.classList.toggle('active', b.dataset.root === rootLabel(selRoot)));
  document.querySelectorAll('#qualities button').forEach(b=> b.classList.toggle('active', b.dataset.q === selQuality));
}

function update(){
  const parsed = parseChord(input.value);
  if(!parsed){
    symEl.textContent = 'Unbekannter Akkord: "' + input.value + '"';
    symEl.classList.add('err'); namesEl.textContent=''; staffEl.innerHTML='';
    return;
  }
  symEl.classList.remove('err');
  selRoot = parsed.root; selQuality = parsed.quality; refreshButtons();
  const notes = chordNotes(selRoot, selQuality);
  symEl.textContent = rootLabel(selRoot) + selQuality;
  namesEl.textContent = notes.map(n => n.letter + (n.alter>0?'♯'.repeat(n.alter):n.alter<0?'♭'.repeat(-n.alter):'')).join('  –  ');
  staffEl.innerHTML = renderStaff(notes);
}

// ---------- Audio (Web Audio API, keine Datenbank nötig) ----------
let actx = null;
function midiFromNote(n){
  // MIDI-Nummer: C4 = 60
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n.letter];
  return 12*(n.octave+1) + base + n.alter;
}
function playChord(notes){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.02;
    const dur = 1.8;
    notes.forEach((n,i)=>{
      const freq = 440 * Math.pow(2, (midiFromNote(n)-69)/12);
      const start = t0 + i*0.06; // Akkord leicht "gerollt"
      // zwei Oszillatoren für einen wärmeren Klang
      [['triangle',0.5],['sine',0.35]].forEach(([type,gain])=>{
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(gain*0.25, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
        osc.connect(g).connect(actx.destination);
        osc.start(start);
        osc.stop(start+dur+0.1);
      });
    });
  }catch(e){
    namesEl.textContent = 'Audio nicht verfügbar: ' + e.message;
  }
}
document.getElementById('playBtn').onclick = ()=>{
  const parsed = parseChord(input.value);
  if(parsed) playChord(chordNotes(parsed.root, parsed.quality));
};

document.getElementById('parseBtn').onclick = update;
input.addEventListener('keydown', e=>{ if(e.key==='Enter') update(); });

input.value = 'Cmaj7';
update();
</script>
</body>
</html>
